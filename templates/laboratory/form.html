{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
  <h1>{{ page_title }}</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">{{ submit_label }}</button>
      <a href="{{ cancel_url }}">Cancel</a>
    </form>
  </div>
{% endblock %}
