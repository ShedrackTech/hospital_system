{% if form.errors %}
  <div role="alert" style="background:#fdecea;border-left:4px solid #b00020;padding:.8rem 1rem;border-radius:4px;margin-bottom:1rem;">
    <strong>Please correct the errors below.</strong>
    <ul style="margin:.4rem 0 0 1rem;padding:0;">
      {% for field in form %}{% for error in field.errors %}
        <li>{% if field.label %}{{ field.label }}: {% endif %}{{ error }}</li>
      {% endfor %}{% endfor %}
      {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  </div>
{% endif %}
