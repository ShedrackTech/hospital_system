<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hospital Portal{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f6fa; margin: 0; padding: 1.5rem 1rem; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; max-width: 520px;
            margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    form p { margin: .8rem 0; }
    input[type=text], input[type=email], input[type=password], input[type=date],
    textarea, select { width: 100%; padding: .55rem; box-sizing: border-box; }
    button, .btn { display: inline-block; padding: .7rem 1.1rem; background: #0b6e99; color: #fff;
                   border: 0; border-radius: 4px; cursor: pointer; text-decoration: none; }
    p:has(input[name=website]) { display: none; }
    .errorlist { color: #b00020; padding-left: 1rem; margin: .2rem 0; }
    .helptext { color: #666; font-size: .85rem; }
    .card-number { font-size: 2rem; letter-spacing: 2px; font-weight: bold; text-align: center;
                   background: #e6f4ea; padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
