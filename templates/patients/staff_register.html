{% extends "base.html" %}
{% block title %}Register patient{% endblock %}
{% block content %}
  <h1>Register patient</h1>
  <p class="muted">Set a temporary password and give it to the patient with their card number.</p>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {% include "patients/_form_errors.html" %}
      {{ form.as_p }}
      <button class="btn" type="submit">Register patient</button>
    </form>
  </div>
{% endblock %}
