{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
  <h1>{{ page_title }}</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="btn-row">
        <button class="btn" type="submit">{{ submit_label }}</button>
        <a class="btn btn-ghost" href="{{ cancel_url }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
