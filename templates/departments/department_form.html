{% extends "base.html" %}
{% block title %}{% if object %}Edit {{ object.name }}{% else %}New department{% endif %}{% endblock %}
{% block content %}
  <h1>{% if object %}Edit {{ object.name }}{% else %}New department{% endif %}</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Save</button>
      <a href="{% url 'departments:list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
