{% if is_paginated %}
<p class="ws-muted">
  {% if page_obj.has_previous %}<a href="?{{ query_extra }}page={{ page_obj.previous_page_number }}">&laquo; Previous</a>{% endif %}
  Page {{ page_obj.number }} of {{ paginator.num_pages }}
  {% if page_obj.has_next %}<a href="?{{ query_extra }}page={{ page_obj.next_page_number }}">Next &raquo;</a>{% endif %}
</p>
{% endif %}
