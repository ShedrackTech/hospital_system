{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<h1>{{ page_title }}</h1>
{% include "website/manage/_nav.html" %}
<form method="post" enctype="multipart/form-data" class="card">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="btn-row">
    <button type="submit">Save</button>
    {% if cancel_url %}<a class="btn btn-ghost" href="{{ cancel_url }}">Cancel</a>{% endif %}
  </div>
</form>
{% endblock %}
